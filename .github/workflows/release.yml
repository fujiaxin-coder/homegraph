name: Release

# Manually triggered ("Run workflow"). Fine-grained jobs so a failed stage can
# be re-run alone (successful jobs are skipped; already-published npm pkgs skip):
#   1. Unit tests
#   2. Prepare CHANGELOG / release notes
#   3. GitHub Release
#   4. Publish homegraph to npm
#   5. Verify homegraph on npm (long registry propagation wait)
#   6. Publish OHOS API db packages
#
# Before triggering: bump package.json. Set NPM_TOKEN and RELEASE_PAT secrets.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release + tag, push the CHANGELOG promote

# Registry CDN lag after npm publish — keep this long; a short window false-fails.
env:
  NPM_VERIFY_ATTEMPTS: '40'
  NPM_VERIFY_SLEEP_SEC: '15'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - name: Test suite
        run: npm test

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare CHANGELOG
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync package-lock.json if version drifted
        run: |
          set -euo pipefail
          PKG_V=$(node -p "require('./package.json').version")
          LOCK_V=$(node -p "require('./package-lock.json').version")
          if [ "$PKG_V" = "$LOCK_V" ]; then
            echo "package-lock.json already at $PKG_V — nothing to sync."
            exit 0
          fi
          echo "Lock-file version drift: lock=$LOCK_V, package=$PKG_V. Syncing."
          npm install --package-lock-only --ignore-scripts
          NEW_LOCK_V=$(node -p "require('./package-lock.json').version")
          if [ "$NEW_LOCK_V" != "$PKG_V" ]; then
            echo "::error::lock-file still at $NEW_LOCK_V after sync attempt; expected $PKG_V"; exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "lock file unchanged after sync? bailing"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package-lock.json to ${PKG_V}" -m "[skip ci] Auto-generated by Release workflow."
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Promote [Unreleased] → [<version>] in CHANGELOG.md
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          node scripts/prepare-release.mjs "$V"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): promote [Unreleased] into [${V}]" -m "[skip ci] Auto-generated by Release workflow."
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          V="${{ steps.ver.outputs.version }}"
          node scripts/extract-release-notes.mjs "$V" > notes.md 2>/dev/null \
            || node scripts/extract-release-notes.mjs Unreleased > notes.md 2>/dev/null || true
          if [ ! -s notes.md ]; then
            echo "::error::No release notes in CHANGELOG.md for [$V] or [Unreleased]."
            exit 1
          fi
          echo "----- release notes -----"; cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

  publish-homegraph:
    name: Publish homegraph
    needs: [test, prepare]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publish homegraph to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${{ needs.prepare.outputs.version }}"
          if npm view "homegraph@$V" version >/dev/null 2>&1; then
            echo "skip homegraph@$V (already published)"
          else
            npm publish --access public
          fi

  verify-homegraph:
    name: Verify homegraph on npm
    needs: publish-homegraph
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.publish-homegraph.outputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Wait until homegraph is visible on the registry
        run: |
          set -euo pipefail
          V="${{ needs.publish-homegraph.outputs.version }}"
          ATTEMPTS="${NPM_VERIFY_ATTEMPTS}"
          SLEEP_SEC="${NPM_VERIFY_SLEEP_SEC}"
          echo "Waiting for homegraph@$V (up to $ATTEMPTS × ${SLEEP_SEC}s ≈ $((ATTEMPTS * SLEEP_SEC / 60)) min)…"
          ok=
          for i in $(seq 1 "$ATTEMPTS"); do
            if npm view "homegraph@$V" version >/dev/null 2>&1; then
              ok=1
              echo "verified homegraph@$V on attempt $i"
              break
            fi
            echo "not visible yet ($i/$ATTEMPTS) — sleep ${SLEEP_SEC}s"
            sleep "$SLEEP_SEC"
          done
          [ -n "$ok" ] || {
            echo "::error::homegraph@$V never appeared on the registry after ${ATTEMPTS} attempts"
            exit 1
          }

  publish-ohos-api-dbs:
    name: Publish OHOS API packages
    needs: verify-homegraph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homegraph
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Clone DevEco SDK trees
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fujiaxin-coder/deveco-sdk.git "$RUNNER_TEMP/deveco-sdk"
          ls -1 "$RUNNER_TEMP/deveco-sdk"/commandline-tools-* || {
            echo "::error::no commandline-tools-* dirs in deveco-sdk"
            exit 1
          }

      - name: Build and publish homegraph-ohos-api-db-* packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.verify-homegraph.outputs.version }}"
          SDK_ROOT="$RUNNER_TEMP/deveco-sdk"
          failed=0
          ok=0

          shopt -s nullglob
          for dir in "$SDK_ROOT"/commandline-tools-*/; do
            name=$(basename "$dir")
            echo "::group::${name}"
            set +e
            node scripts/ohos-sdk-publish.mjs "$dir" --pkg-version "$V" --skip-if-published
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              ok=$((ok + 1))
              echo "ok: $name"
            else
              failed=$((failed + 1))
              echo "::error::failed: $name (exit $rc) — continuing with remaining versions"
            fi
            echo "::endgroup::"
          done

          echo "summary: ok_or_skipped=$ok failed=$failed (homegraph@$V already published)"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed SDK db package(s) failed — re-run this job to retry; already-published versions are skipped"
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::no commandline-tools-* packages processed"
            exit 1
          fi
